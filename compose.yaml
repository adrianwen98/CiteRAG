services:
  rag-api:
    build: .
    image: rag-api
    container_name: rag-api-container

    env_file:
      - .env

    ports:
      - "8002:8002"

    volumes:
      - rag-chroma-data:/app/chroma_db

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  rag-chroma-data:
    name: rag-chroma-data
